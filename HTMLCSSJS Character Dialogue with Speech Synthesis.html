<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vikas & Vinay</title>
  <style>
    body {
      margin: 0; display: flex; justify-content: space-around;
      align-items: center; height: 100vh; background: #698498;
    }
    .character {
      position: relative; width: 150px; height: 150px;
    }
    .character img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 20px rgba(159, 12, 12, 0.2);
    }
    .speech {
      position: absolute; top: -70px; width: 200px;
      background: #12e154; border: 2px solid #333;
      border-radius: 10px; padding: 8px; text-align: center;
      font: 14px Arial; opacity: 0; animation: speak 8s infinite;
    }
    .right .speech { animation-delay: 4s; }
    @keyframes speak { 0%,100%{opacity:0} 10%,30%{opacity:1} }
  </style>
</head>
<body>
  <div class="character left">
    <img src="vikas.jpg" alt="Vikas">
    <div class="speech" id="s1">Hi, I’m Vikas! I love coding.</div>
  </div>
  <div class="character right">
    <img src="vinay.jpg" alt="Vinay">
    <div class="speech" id="s2">Hey! I’m Vinay. Let’s collaborate!</div>
  </div>
  <script>
    function speak(text) {
      const u = new SpeechSynthesisUtterance(text);
      u.pitch = 1.2; u.rate = 1; speechSynthesis.speak(u);
    }
    window.onload = () => {
      setTimeout(() => speak(s1.innerText), 1000);
      setTimeout(() => speak(s2.innerText), 5000);
    };
  </script>
</body>
</html>
